services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: gyo_cms
      POSTGRES_USER: gyo
      POSTGRES_PASSWORD: gyo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gyo -d gyo_cms']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
